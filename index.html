<!DOCTYPE html>
<html lang="ko">
<head>  
  <meta charset="UTF-8" http-equiv="Content-Security-Policy" content="default-src 'self' http://localhost:8080; script-src 'self' 'unsafe-eval' http://localhost:8080; style-src 'self' 'unsafe-inline';">
  <title>타이니시트</title>
  <style>
    /* 번들이 주입(styles.css)되기 전에도 보여야 하므로 스피너 스타일은 인라인으로 둔다. */
    .loading-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #fff;
      font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
      color: #555;
    }
    .loading-screen .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid #e4e4e4;
      border-top-color: #4a90d9;
      border-radius: 50%;
      animation: loading-spin 0.8s linear infinite;
    }
    .loading-screen .message { font-size: 13px; }
    @keyframes loading-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loading-screen" id="loading-screen">
    <div class="spinner"></div>
    <div class="message">시트를 준비하는 중...</div>
  </div>
  <div class="tinysheet-container">
    <div class="formula-bar">
      <div class="cell-address-box" id="cell-address"></div>
      <div class="formula-bar-sep"></div>
      <div class="formula-bar-label"></div>
      <input type="text" class="formula-bar-input" id="formula-bar-input" />
    </div>
    <div class="grid-wrapper">
      <table id="spreadsheet" class="spreadsheet-table"></table>
      <div class="selection-overlay">
        <div class="fill-handle"></div>
      </div>
    </div>
    <div class="status-bar">
      <div class="status-ready">준비</div>
      <div class="zoom-controls">
        <button type="button" class="zoom-btn" id="zoom-out" title="축소 (Ctrl+-)">−</button>
        <button type="button" class="zoom-btn zoom-value" id="zoom-value" title="100%로 초기화 (Ctrl+0)">100%</button>
        <button type="button" class="zoom-btn" id="zoom-in" title="확대 (Ctrl++)">+</button>
      </div>
    </div>
  </div>
</body>
</html>
