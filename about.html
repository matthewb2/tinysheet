<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>정보</title>

<style>
    body {
      margin: 0;
      padding: 40px 30px 24px;
      font-family: 'Malgun Gothic', 'Segoe UI', sans-serif;
      background: #eeeeee;
      height: 100vh;
      overflow: hidden;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between; /* 상단 콘텐츠와 하단 버튼을 위아래로 분리 */
      align-items: center;
      text-align: center;
    }
    img {
      width: 180px;
      height: 180px;
      display: block;
      margin: 0 auto 0px;
    }
    .title {
      font-size: 22px;
      font-weight: bold;
      color: #222;
      margin: 0 0 10px;
    }
    .info {
      font-size: 14px;
      color: #555;
      margin: 0;
    }
    .button-container {
      width: 100%;
      display: flex;
      justify-content: flex-end; /* 버튼을 오른쪽 끝으로 정렬 */
    }
    .close-btn {
      padding: 6px 24px;
      font-size: 14px;
      font-family: inherit;
      color: #fff;
      background: #4a6cf7;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .close-btn:hover {
      background: #3a5ae0;
    }
  </style>
  
</head>
<body>
  <div>
    <img src="./assets/icon.png" alt="이지시트 로고">
    <p class="title">타이니시트</p>
    <p class="info">2026 copyright 엠케이솔루션 제공</p>
  </div>
  <div class="button-container">
    <button class="close-btn" id="close-btn">닫기</button>
  </div>
  <script>
    document.getElementById('close-btn').addEventListener('click', () => {
      window.aboutAPI.close();
    });
  </script>
</body>
</html>
